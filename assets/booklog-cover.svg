<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
<title id="title">BookLog — um lugar para cada história</title>
<desc id="desc">Banner original do BookLog, com ilustrações de duas telas conceituais de biblioteca e comunidade de leitura. iOS na App Store e Android em beta.</desc>
