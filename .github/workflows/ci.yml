name: Documentação
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar estrutura, links e rastreabilidade
        run: node scripts/validate-docs.mjs
