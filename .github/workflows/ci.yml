name: Integridade do portfólio

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verificar documentos, links, imagens e referências
        run: node scripts/validate-docs.mjs

      - name: Validar SVG como XML
        run: python3 scripts/validate-svg.py
